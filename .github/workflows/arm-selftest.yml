name: ARM engine self-test
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/arm-selftest.yml', 'ci/selftest/**', 'native/cpp/jarvis_llm.cpp']

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: ['armv8-a', 'armv8.2-a+dotprod+fp16']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Build engine wrapper (${{ matrix.arch }})
        run: |
          exec > >(tee -a /tmp/out.txt) 2>&1
          git clone -q --depth 1 --branch b11936 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          export CC=clang CXX=clang++
          cmake -S ci/selftest -B /tmp/b -DCMAKE_BUILD_TYPE=Release -DLLAMA_SRC=/tmp/llama.cpp \
            -DJARVIS_CPP=$PWD/native/cpp/jarvis_llm.cpp -DGGML_CPU_ARM_ARCH=${{ matrix.arch }} > /tmp/cmake.log
          cmake --build /tmp/b -j4 > /tmp/build.log 2>&1 || true
          grep -B15 -E " error|error:" /tmp/build.log | cut -c1-400 | head -60
          ls /tmp/b/bin
      - name: Models
        run: |
          exec > >(tee -a /tmp/out.txt) 2>&1
          get() { f=$(curl -s https://huggingface.co/api/models/$1 | jq -r '.siblings[].rfilename' | grep -i "$2" | head -1); echo "$1 -> $f"; curl -sL -o "/tmp/$3" "https://huggingface.co/$1/resolve/main/$f"; }
          get mlabonne/Qwen3-0.6B-abliterated-GGUF 'q8_0' nano.gguf
          get bartowski/mlabonne_Qwen3-1.7B-abliterated-GGUF 'Q4_K_L' lite.gguf
      - name: Run wrapper exactly like the app
        run: |
          exec > >(tee -a /tmp/out.txt) 2>&1
          cd ci/selftest && javac -d /tmp/cls src/com/jarvis/assistant/*.java
          for m in nano lite; do for t in 4 1; do
            echo "=== ${{ matrix.arch }} $m threads=$t ==="
            timeout 900 java -Djava.library.path=/tmp/b/bin -cp /tmp/cls com.jarvis.assistant.Test /tmp/b/bin /tmp/$m.gguf $t 2>&1 | grep -E "^(LOAD|CHAT|SYSINFO)|error|Error" | cut -c1-900
          done; done
      - name: Publish
        if: always()
        run: |
          b=selftest-$(echo '${{ matrix.arch }}' | tr -c 'a-z0-9\n' '-')
          cd "$(mktemp -d)"; git init -q; git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout -q -b $b; cp /tmp/out.txt OUT.txt 2>/dev/null || echo none > OUT.txt
          git add OUT.txt; git commit -qm out; git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $b
