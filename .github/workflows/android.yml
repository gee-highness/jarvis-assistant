name: Build Jarvis APK

on:
  push:
    branches: [main]
    paths-ignore: ['ci/**', '.github/workflows/arm-selftest.yml']
  workflow_dispatch:
    inputs:
      abis:
        description: 'CPU architectures (arm64-v8a for phones; add x86_64 for emulators)'
        default: 'arm64-v8a'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 75
    env:
      NDK_VERSION: "29.0.13113456"
      CMAKE_VERSION: "3.31.6"
      JARVIS_KS_PASS: "jarvis-release"
      JARVIS_ABIS: ${{ github.event.inputs.abis || 'arm64-v8a' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" 2>&1 | tail -n 3 | tee -a build.log

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            native/cpp/llama.cpp
            native/.cxx
          key: native-${{ env.JARVIS_ABIS }}-${{ hashFiles('scripts/prepare-android.mjs', 'native/cpp/CMakeLists.txt', 'native/cpp/*.cpp') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package.json', 'scripts/prepare-android.mjs') }}

      - name: Install dependencies
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee -a build.log

      - name: Build web app
        run: |
          set -o pipefail
          npx ng build --configuration production 2>&1 | tee -a build.log

      # Stable signing: the keystore lives in the repo secret JARVIS_KEYSTORE_B64 (never in git).
      # Without it the build falls back to a debug-signed APK, which cannot update over earlier builds.
      - name: Signing key
        env:
          KS_B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/jarvis.jks"
            echo "JARVIS_KEYSTORE=$RUNNER_TEMP/jarvis.jks" >> "$GITHUB_ENV"
            echo "GRADLE_TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK_PATH=release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "GRADLE_TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "APK_PATH=debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "::warning::JARVIS_KEYSTORE_B64 secret missing: building a debug-signed APK"
          fi

      - name: Prepare Android project
        run: |
          set -o pipefail
          node scripts/prepare-android.mjs 2>&1 | tee -a build.log

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew $GRADLE_TASK --no-daemon --stacktrace 2>&1 | tee -a ../build.log

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/$APK_PATH out/jarvis.apk
          ls -la out
          unzip -l out/jarvis.apk | grep -E "\.so$" | tee -a build.log

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: out/jarvis.apk
          retention-days: 30

      - name: Publish release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis build ${{ github.run_number }}
          files: out/jarvis.apk
          make_latest: true

      # Build logs go to the `build-logs` branch so they can be read without Actions log access.
      - name: Publish build log
        if: always()
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "no log captured" > /tmp/build.log
          cd "$(mktemp -d)"
          git init -q
          git config user.name "jarvis-ci"
          git config user.email "jarvis-ci@users.noreply.github.com"
          git checkout -q -b build-logs
          tail -c 400000 /tmp/build.log > BUILD_LOG.txt
          grep -nE "error|Error|ERROR|FAILED|failed" /tmp/build.log | head -400 > ERRORS.txt || true
          echo "run=${{ github.run_number }} status=${{ job.status }} sha=${{ github.sha }}" > STATUS.txt
          git add BUILD_LOG.txt ERRORS.txt STATUS.txt
          git commit -qm "build log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
