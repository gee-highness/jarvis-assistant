name: Build Jarvis APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npx ng build --configuration production

      - name: Prepare Android project
        run: node scripts/prepare-android.mjs

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: out/jarvis.apk
          retention-days: 30

      - name: Publish release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis build ${{ github.run_number }}
          files: out/jarvis.apk
          make_latest: true
